<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ميزان - لوحة التحكم</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="layout">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <h2>⚖️ ميزان</h2>
      <p>المساعد القانوني الذكي</p>
    </div>
    <nav class="sidebar-nav">
      <button class="nav-item" data-page="dashboard" onclick="navigateTo('dashboard')">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        لوحة التحكم
      </button>
      <button class="nav-item" data-page="documents" onclick="navigateTo('documents')">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        المستندات
      </button>
      <button class="nav-item" data-page="new-document" onclick="navigateTo('new-document')">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        مستند جديد
      </button>
      <button class="nav-item" data-page="templates" onclick="navigateTo('templates')">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
        القوالب
      </button>
      <button class="nav-item" data-page="chat" onclick="navigateTo('chat')">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        استشارة AI
      </button>
    </nav>
    <div class="sidebar-footer">
      <div class="user-info">
        <strong id="user-name">...</strong>
        <span id="user-email"></span>
      </div>
      <button class="btn btn-sm" style="margin-top:10px;width:100%;color:#a0aec0;background:rgba(255,255,255,.06);border:none" onclick="doLogout()">تسجيل الخروج</button>
    </div>
  </aside>

  <!-- Main -->
  <div class="main">
    <header class="topbar">
      <h2 id="page-title">لوحة التحكم</h2>
      <div style="font-size:.85rem;color:var(--text-muted)">نظام ميزان القانوني</div>
    </header>
    <div class="page-content" id="page-content"></div>
  </div>
</div>

<div id="toast-container"></div>

<script src="/static/js/app.js"></script>
<script>
async function doLogout() {
  try { await apiFetch('/api/auth/logout', { method: 'POST' }); } catch {}
  clearToken();
  window.location.href = '/';
}
</script>
</body>
</html>
