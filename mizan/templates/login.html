<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ميزان - تسجيل الدخول</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div id="auth-page" class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <h1>⚖️ ميزان</h1>
      <p>نظام الذكاء الاصطناعي القانوني</p>
    </div>

    <div id="tab-btns" style="display:flex;gap:8px;margin-bottom:24px">
      <button class="btn btn-primary" style="flex:1" onclick="showTab('login')">تسجيل الدخول</button>
      <button class="btn btn-outline" style="flex:1" onclick="showTab('register')">حساب جديد</button>
    </div>

    <!-- Login -->
    <div id="tab-login">
      <div class="form-group">
        <label class="form-label">البريد الإلكتروني</label>
        <input class="form-control" id="l-email" type="email" placeholder="example@domain.com">
      </div>
      <div class="form-group">
        <label class="form-label">كلمة المرور</label>
        <input class="form-control" id="l-password" type="password" placeholder="••••••••">
      </div>
      <div class="form-group">
        <label class="form-label">رمز المنظمة</label>
        <input class="form-control" id="l-slug" placeholder="my-office">
      </div>
      <button class="btn btn-primary" style="width:100%" onclick="doLogin()">دخول</button>
    </div>

    <!-- Register -->
    <div id="tab-register" style="display:none">
      <div class="form-group">
        <label class="form-label">اسم المنظمة</label>
        <input class="form-control" id="r-org-name" placeholder="مكتب المحاماة">
      </div>
      <div class="form-group">
        <label class="form-label">رمز المنظمة (إنجليزي بدون مسافات)</label>
        <input class="form-control" id="r-slug" placeholder="my-office">
      </div>
      <div class="form-group">
        <label class="form-label">الاسم الكامل</label>
        <input class="form-control" id="r-name" placeholder="أحمد علي">
      </div>
      <div class="form-group">
        <label class="form-label">البريد الإلكتروني</label>
        <input class="form-control" id="r-email" type="email" placeholder="example@domain.com">
      </div>
      <div class="form-group">
        <label class="form-label">كلمة المرور</label>
        <input class="form-control" id="r-password" type="password" placeholder="8 أحرف على الأقل">
      </div>
      <button class="btn btn-primary" style="width:100%" onclick="doRegister()">إنشاء الحساب</button>
    </div>

    <div id="toast-container"></div>
  </div>
</div>

<script src="/static/js/app.js"></script>
<script>
function showTab(tab) {
  document.getElementById('tab-login').style.display = tab === 'login' ? '' : 'none';
  document.getElementById('tab-register').style.display = tab === 'register' ? '' : 'none';
  const btns = document.getElementById('tab-btns').querySelectorAll('button');
  btns[0].className = tab === 'login' ? 'btn btn-primary' : 'btn btn-outline';
  btns[0].style.flex = '1';
  btns[1].className = tab === 'register' ? 'btn btn-primary' : 'btn btn-outline';
  btns[1].style.flex = '1';
}

async function doLogin() {
  const email = document.getElementById('l-email').value.trim();
  const password = document.getElementById('l-password').value;
  const tenant_slug = document.getElementById('l-slug').value.trim();
  if (!email || !password || !tenant_slug) { toast('أكمل جميع الحقول', 'error'); return; }
  try {
    const res = await apiFetch('/api/auth/login', {
      method: 'POST',
      body: JSON.stringify({ email, password, tenant_slug }),
    });
    setToken(res.access_token);
    const user = await apiFetch('/api/auth/me');
    setUser(user);
    window.location.href = '/dashboard';
  } catch (e) { toast(e.message, 'error'); }
}

async function doRegister() {
  const orgName = document.getElementById('r-org-name').value.trim();
  const slug = document.getElementById('r-slug').value.trim();
  const full_name = document.getElementById('r-name').value.trim();
  const email = document.getElementById('r-email').value.trim();
  const password = document.getElementById('r-password').value;
  if (!orgName || !slug || !full_name || !email || !password) { toast('أكمل جميع الحقول', 'error'); return; }
  try {
    await apiFetch('/api/tenants', { method: 'POST', body: JSON.stringify({ name: orgName, slug }) });
  } catch (e) {
    if (!e.message.includes('مسبقاً')) { toast(e.message, 'error'); return; }
  }
  try {
    await apiFetch('/api/auth/register', {
      method: 'POST',
      body: JSON.stringify({ email, full_name, password, tenant_slug: slug }),
    });
    toast('تم إنشاء الحساب، سجّل دخولك الآن', 'success');
    document.getElementById('l-email').value = email;
    document.getElementById('l-slug').value = slug;
    showTab('login');
  } catch (e) { toast(e.message, 'error'); }
}
</script>
</body>
</html>
